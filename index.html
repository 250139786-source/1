<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AI Reels Pro - Instagram 视频营销生成器</title>

<style>
body{
font-family:Arial,"Microsoft YaHei";
background:#f7f7f7;
padding:30px;
max-width:700px;
margin:auto;
}

h1{
font-size:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #ddd;
}

input,textarea{
width:100%;
padding:15px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#111;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:.8;
}

#result{
margin-top:20px;
background:#f0f0f0;
padding:20px;
border-radius:10px;
white-space:pre-line;
}

.tag{
display:inline-block;
background:#eee;
padding:6px 12px;
border-radius:20px;
margin:5px;
}

</style>
</head>


<body>

<div class="card">

<h1>🚀 AI Instagram Reels Pro</h1>

<p>
输入商品信息，自动生成跨境电商短视频营销方案。
</p>


<input id="product"
placeholder="商品名称，例如：智能手表">


<input id="link"
placeholder="商品链接">


<textarea id="feature"
placeholder="商品卖点，例如：防水、省电、适合运动"></textarea>


<button onclick="generate()">
生成爆款 Reels 视频
</button>


<div id="result"></div>


</div>



<script>

function generate(){

let p=document.getElementById("product").value || "热门商品";

let l=document.getElementById("link").value || "商品链接";

let f=document.getElementById("feature").value || "高性价比";


let text=

"🔥 Instagram Reels 视频脚本\n\n"+

"商品："+p+"\n\n"+

"【0-3秒 黄金开场】\n"+
"Stop scrolling! You need to see this amazing product!\n\n"+

"【3-8秒 产品展示】\n"+
"展示用户痛点，然后展示 "+p+" 如何解决问题。\n\n"+

"【8-12秒 卖点强化】\n"+
f+"\n\n"+

"【12-15秒 行动引导】\n"+
"Click the link now and get yours today!\n\n"+

"📌 发布标题：\n"+
"Why everyone is buying "+p+" 🔥\n\n"+

"📌 Hashtags:\n"+
"#amazonfinds #viralproducts #shopping #musthave #reels\n\n"+

"🔗 商品链接：\n"+
l;


document.getElementById("result").innerText=text;

}

</script>


</body>
</html>
