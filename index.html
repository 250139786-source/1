<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Reels 视频生成器</title>
<style>
body{font-family:Arial;padding:30px;max-width:600px;margin:auto}
input,textarea,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
button{cursor:pointer}
#out{white-space:pre-wrap;background:#f5f5f5;padding:15px}
</style>
</head>
<body>
<h2>AI Instagram Reels 制作器</h2>
<p>输入商品信息，生成短视频脚本。</p>
<input id="product" placeholder="商品名称">
<input id="link" placeholder="商品链接">
<textarea id="style" placeholder="视频风格">爆款营销</textarea>
<button onclick="make()">生成脚本</button>
<div id="out"></div>

<script>
function make(){
 let p=document.getElementById('product').value || "热门商品";
 let s=document.getElementById('style').value;
 document.getElementById('out').innerText =
 `标题：${p} 你可能不知道的隐藏价值\n\n`+
 `视频脚本：\n1. 3秒吸引：为什么大家都在关注${p}\n`+
 `2. 展示产品特点\n3. 使用场景演示\n4. 行动引导：主页查看链接\n\n风格：${s}`;
}
</script>
</body>
</html>
