<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Reels Pro 2.0</title>

<style>

body{
font-family:Arial,"Microsoft YaHei";
background:#f5f5f5;
padding:20px;
max-width:750px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px #ddd;
}

h1{
font-size:30px;
}

input,textarea,select{

width:100%;
padding:15px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;

}

textarea{
height:100px;
}

button{

width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:18px;
margin-top:10px;

}

.copy{
background:#1677ff;
}

.result{

background:#fafafa;
margin-top:20px;
padding:20px;
border-radius:12px;
white-space:pre-line;
line-height:1.8;

}

</style>

</head>


<body>


<div class="card">


<h1>
🚀 AI Reels Pro 2.0
</h1>


<p>
跨境电商 Instagram / TikTok 爆款视频生成器
</p>


<input id="product"
placeholder="商品名称，例如：智能手表">


<input id="link"
placeholder="商品链接">


<textarea id="feature"
placeholder="商品卖点，例如：防水、健康监测、长续航"></textarea>


<select id="market">

<option>
美国市场
</option>

<option>
欧洲市场
</option>

<option>
东南亚市场
</option>

</select>


<button onclick="generate()">

生成爆款 Reels 视频方案

</button>


<div id="result" class="result">

等待生成...

</div>


<button class="copy" onclick="copyText()">

复制全部内容

</button>


<script>


let finalText="";


function generate(){

let product=
document.getElementById("product").value
||"热门商品";


let link=
document.getElementById("link").value
||"商品链接";


let feature=
document.getElementById("feature").value
||"高质量，好用";


let market=
document.getElementById("market").value;
finalText =

`
🔥 AI Reels Pro 2.0


📦 商品

${product}


🌍 市场

${market}



================


🎬 15秒爆款视频脚本



【0-3秒 黄金开场 Hook】


画面：
产品快速出现，制造视觉冲击


字幕：

STOP SCROLLING! 🔥

You need to see this!



================



【3-8秒 产品展示】


画面：

展示 ${product}

真实使用场景


字幕：

The product everyone is talking about.



================



【8-12秒 卖点强化】


产品优势：

${feature}


画面：

展示细节、功能、使用效果



字幕：

Simple.
Useful.
Perfect for everyday life.



================



【12-15秒 行动引导】


画面：

产品 + 购买按钮


字幕：

Get yours today!



================



🎙 英文AI口播


This product is changing the way people live.


It is simple, useful and perfect for everyday life.


Click the link and get yours today!



================



🎥 AI视频生成提示词


Create a viral vertical 9:16 product advertisement video.


Product:
${product}


Style:

Modern Instagram Reels style.

High quality cinematic lighting.

Professional product showcase.


Scenes:

1. Product close-up

2. Customer using product

3. Show product benefits

4. Call to action



================



📱 Instagram标题


Why everyone wants ${product} 🔥



================



🏷️ Hashtags


#amazonfinds

#viralproducts

#musthave

#shopping

#reels

#tiktokmademebuyit



================


🛒 商品链接


${link}


`

}
function copyText(){

navigator.clipboard.writeText(finalText);

alert("已复制，可以发布到 Instagram / TikTok");

}


</script>


</div>


</body>

</html>
